name: CI Build & Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v2

      - name: Build and start services (compose)
        run: |
          docker-compose -f infra/docker-compose.yml up -d --build

      - name: Build additional service images
        run: |
          docker build -f api/Dockerfile -t agri-nest/api:latest api
          docker build -f api/server_ts/Dockerfile -t agri-nest/api-ts:latest api/server_ts
          docker build -f api/fastapi/Dockerfile -t agri-nest/api-fastapi:latest api/fastapi

      - name: Wait for API port
        run: |
          for i in {1..30}; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3000 || echo 000)
            if [ "$status" != "000" ]; then echo "api up (http status $status)"; break; fi
            sleep 2
          done

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run integration tests
        run: npm test

      - name: Smoke test endpoints
        run: |
          # Register user
          curl -sS -X POST http://localhost:3000/auth/register -H 'Content-Type: application/json' -d '{"phone":"+255700000001","name":"Pilot Farmer"}' | jq .
          # Create farm
          curl -sS -X POST http://localhost:3000/farms -H 'Content-Type: application/json' -d '{"user_id":"u_test","name":"Pilot Farm"}' | jq .
          # Jicho scan
          curl -sS -X POST http://localhost:3000/jicho/scan -H 'Content-Type: application/json' -d '{"farmer_id":"u_test","image_base64":"AAA"}' | jq .

      - name: Tear down
        if: always()
        run: |
          docker-compose -f infra/docker-compose.yml down

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Validate AWS ECS Terraform
        working-directory: infra/terraform/aws-ecs
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate GKE Terraform
        working-directory: infra/terraform/gke
        run: |
          terraform init -backend=false
          terraform validate

  publish-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.repository_owner == 'YOUR_ORG' && secrets.GHCR_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Tag & push images
        run: |
          docker tag agri-nest/api:latest ghcr.io/${{ github.repository_owner }}/agri-nest/api:latest
          docker push ghcr.io/${{ github.repository_owner }}/agri-nest/api:latest
          docker tag agri-nest/api-ts:latest ghcr.io/${{ github.repository_owner }}/agri-nest/api-ts:latest
          docker push ghcr.io/${{ github.repository_owner }}/agri-nest/api-ts:latest
          docker tag agri-nest/api-fastapi:latest ghcr.io/${{ github.repository_owner }}/agri-nest/api-fastapi:latest
          docker push ghcr.io/${{ github.repository_owner }}/agri-nest/api-fastapi:latest
