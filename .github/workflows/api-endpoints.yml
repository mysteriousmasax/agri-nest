name: API Endpoint Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Start API server
        run: |
          node api/server.js &
          sleep 2
      - name: Run endpoint validation
        run: node api/test-endpoints.js
