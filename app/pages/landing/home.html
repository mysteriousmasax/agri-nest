<script>
  const AppLanding = {
    enterAs(role) {
      const user = DB.users.find((u) => u.role === role);
      if (user) {
        Shell.handleLogin(user.email, role, user);
        return;
      }
      Router.navigate('/auth/login');
    },
  };
</script>
