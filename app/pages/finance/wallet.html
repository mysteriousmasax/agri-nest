<main class="p-4 md:p-8 max-w-7xl mx-auto">

<!-- Page Header & Quick Actions -->
<div class="flex flex-col md:flex-row md:items-end justify-between mb-section-gap gap-6">
<div>
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Hesabu Yangu</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Financial overview for Season 2024</p>
</div>
<div class="flex flex-wrap gap-3">
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-6 py-3 rounded-lg flex items-center hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined mr-2">add</span>
                        Add Income
                    </button>
<button class="bg-surface border border-outline font-label-lg text-label-lg px-6 py-3 rounded-lg flex items-center hover:bg-surface-variant transition-colors text-on-surface">
<span class="material-symbols-outlined mr-2">remove</span>
                        Log Expense
                    </button>
<button class="bg-tertiary-fixed text-on-tertiary-fixed font-label-lg text-label-lg px-6 py-3 rounded-lg flex items-center hover:bg-tertiary-fixed/80 transition-colors">
<span class="material-symbols-outlined mr-2">account_balance</span>
                        Apply for Loan
                    </button>
</div>
</div>
<!-- Bento Grid Layout -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-section-gap">
<!-- Cash Flow Summary Cards (Span 12, internal grid) -->
<div class="md:col-span-12 grid grid-cols-1 md:grid-cols-3 gap-6">
<!-- Income Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 soft-shadow soft-border flex flex-col justify-between">
<div class="flex items-center justify-between mb-4">
<span class="font-label-lg text-label-lg text-on-surface-variant">Season Income</span>
<div class="w-10 h-10 rounded-full bg-tertiary-fixed flex items-center justify-center text-on-tertiary-fixed">
<span class="material-symbols-outlined">trending_up</span>
</div>
</div>
<div>
<h3 class="font-display-lg text-display-lg text-on-surface mb-1">KES 450,000</h3>
<div class="flex items-center text-tertiary-container font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] mr-1">arrow_upward</span>
<span>+12% vs last season</span>
</div>
</div>
</div>
<!-- Expenses Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 soft-shadow soft-border flex flex-col justify-between">
<div class="flex items-center justify-between mb-4">
<span class="font-label-lg text-label-lg text-on-surface-variant">Total Expenses</span>
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
<span class="material-symbols-outlined">trending_down</span>
</div>
</div>
<div>
<h3 class="font-display-lg text-display-lg text-on-surface mb-1">KES 180,000</h3>
<div class="flex items-center text-on-surface-variant font-label-md text-label-md">
<span>Primarily inputs &amp; labour</span>
</div>
</div>
</div>
<!-- Net Profit Card -->
<div class="bg-primary text-on-primary rounded-xl p-6 soft-shadow flex flex-col justify-between relative overflow-hidden">
<div class="absolute -right-6 -top-6 w-32 h-32 bg-primary-fixed-dim rounded-full opacity-20 blur-2xl"></div>
<div class="flex items-center justify-between mb-4 relative z-10">
<span class="font-label-lg text-label-lg text-primary-fixed">Net Profit</span>
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
</div>
<div class="relative z-10">
<h3 class="font-display-lg text-display-lg mb-1">KES 270,000</h3>
<div class="flex items-center text-primary-fixed font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] mr-1">check_circle</span>
<span>On track for targets</span>
</div>
</div>
</div>
</div>
</div>

</main>
