<main class="p-4 md:p-8 max-w-7xl mx-auto flex flex-col h-[calc(100vh-80px)]">

  <!-- Top App Bar -->
  <header class="flex items-center justify-between px-4 py-3 w-full bg-surface-container-low border-b border-outline-variant/10 rounded-t-xl shrink-0">
    <div class="flex items-center gap-4">
      <h2 class="font-headline-md text-headline-md font-bold text-primary">Community Hub</h2>
      <div class="hidden md:flex items-center gap-2 bg-primary/5 px-3 py-1 rounded-full text-xs text-primary font-bold">
        <span class="w-2 h-2 bg-success rounded-full animate-pulse"></span>
        <span>1,402 Farmers Online</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button class="text-on-surface-variant hover:bg-primary/5 p-2 rounded-full transition-colors relative" onclick="Router.navigate('/user/notifications')">
        <span class="material-symbols-outlined">notifications</span>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full"></span>
      </button>
      <button class="text-on-surface-variant hover:bg-primary/5 p-2 rounded-full transition-colors" onclick="Router.navigate('/user/settings')">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>
  </header>

  <!-- Main Chat Container (Split Panel) -->
  <div class="flex flex-grow border border-t-0 border-outline-variant/10 rounded-b-xl overflow-hidden bg-surface-container-lowest">
    
    <!-- Left Column: Conversations Sidebar -->
    <section class="w-80 border-r border-outline-variant/10 flex flex-col shrink-0">
      <!-- Search -->
      <div class="p-4 border-b border-outline-variant/10 bg-surface-container-low/30">
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
          <input id="chat-search" class="w-full pl-10 pr-4 py-2 bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary/20 text-body-sm font-body-sm" placeholder="Search chats..." type="text"/>
        </div>
      </div>
      
      <!-- Thread Selection List -->
      <div id="chat-sidebar-list" class="flex-grow overflow-y-auto p-2 space-y-1">
        <!-- Dynanically populated list of contacts -->
        <div class="skeleton-list p-4 space-y-3">
          <div class="skeleton h-12 w-full rounded-xl"></div>
          <div class="skeleton h-12 w-full rounded-xl"></div>
          <div class="skeleton h-12 w-full rounded-xl"></div>
        </div>
      </div>
    </section>

    <!-- Right Column: Active Conversation Canvas -->
    <section class="flex-grow flex flex-col bg-surface overflow-hidden">
      <!-- Active Thread Header Details -->
      <div id="chat-active-header" class="px-6 py-4 border-b border-outline-variant/10 bg-surface-bright flex items-center justify-between shadow-sm shrink-0">
        <div class="flex items-center gap-3">
          <div id="chat-header-avatar" class="w-10 h-10 rounded-full flex items-center justify-center bg-primary/10 text-primary text-headline-sm font-bold overflow-hidden">
            <!-- Dynamic Avatar -->
          </div>
          <div>
            <h3 id="chat-header-title" class="font-label-lg text-label-lg text-primary font-bold">Loading thread...</h3>
            <p id="chat-header-subtitle" class="text-[11px] text-outline flex items-center gap-1">
              <span class="w-2 h-2 bg-success rounded-full"></span> Active Now
            </p>
          </div>
        </div>
        <div class="flex gap-1">
          <button class="p-2 text-outline hover:text-primary rounded-full hover:bg-primary/5 transition-colors">
            <span class="material-symbols-outlined">call</span>
          </button>
          <button class="p-2 text-outline hover:text-primary rounded-full hover:bg-primary/5 transition-colors">
            <span class="material-symbols-outlined">videocam</span>
          </button>
          <button class="p-2 text-outline hover:text-primary rounded-full hover:bg-primary/5 transition-colors">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
        </div>
      </div>

      <!-- Security Trust Shield Banner -->
      <div class="bg-tertiary-fixed-dim/10 px-6 py-2 flex items-center gap-2 border-b border-tertiary-fixed-dim/20 shrink-0">
        <span class="material-symbols-outlined text-tertiary-container text-[16px]">security</span>
        <p class="font-label-md text-label-md text-on-tertiary-fixed-variant text-[11px] leading-tight">
          Agri-Nest Safe Shield: All communication is encrypted. Payments made through Agri-Nest Escrow are 100% protected.
        </p>
      </div>

      <!-- Messages Message Canvas -->
      <div id="chat-canvas" class="flex-grow overflow-y-auto p-6 space-y-4">
        <!-- Dynamic message logs are injected here -->
      </div>

      <!-- Typing Indicator Spot -->
      <div id="chat-typing-indicator" class="px-6 py-2 bg-surface-container-low text-xs text-outline italic hidden flex items-center gap-2 border-t border-outline-variant/10 transition-all">
        <span class="w-1.5 h-1.5 bg-outline rounded-full animate-bounce" style="animation-delay: 0ms"></span>
        <span class="w-1.5 h-1.5 bg-outline rounded-full animate-bounce" style="animation-delay: 150ms"></span>
        <span class="w-1.5 h-1.5 bg-outline rounded-full animate-bounce" style="animation-delay: 300ms"></span>
        <span id="chat-typing-text">Someone is typing...</span>
      </div>

      <!-- Message Text Input Area -->
      <div class="p-4 bg-surface-container-lowest border-t border-outline-variant/10 shrink-0">
        <div class="flex items-center gap-2 bg-surface-container-low border border-outline-variant/20 rounded-2xl p-1.5 shadow-sm focus-within:ring-2 focus-within:ring-primary/20 transition-all">
          <div class="flex items-center gap-0.5 px-1">
            <button class="p-2 text-outline hover:text-primary rounded-full transition-colors active:scale-95">
              <span class="material-symbols-outlined">attach_file</span>
            </button>
            <button class="p-2 text-outline hover:text-primary rounded-full transition-colors active:scale-95">
              <span class="material-symbols-outlined">photo_camera</span>
            </button>
          </div>
          <input id="chat-input-text" class="flex-grow bg-transparent border-none focus:ring-0 font-body-md text-body-md py-2 px-1 text-on-surface outline-none" placeholder="Type a message in Swahili or English..." type="text"/>
          <button id="chat-send-btn" class="bg-primary text-white w-10 h-10 rounded-xl flex items-center justify-center hover:opacity-90 active:scale-90 transition-all shadow-md shrink-0">
            <span class="material-symbols-outlined">send</span>
          </button>
        </div>
      </div>
    </section>

  </div>

</main>

<script>
  (function() {
    let currentThreadId = 'group_iringa';

    const threads = [
      {
        id: 'group_iringa',
        name: 'Iringa Maize Growers (Group)',
        subtitle: 'Cooperative Forum',
        type: 'group',
        icon: 'group',
        color: 'bg-primary/10 text-primary',
        seededMessages: [
          { id: 1, sender: 'Juma Hassan', text: 'Habari za asubuhi! Is anyone buying Urea fertilizer this week?', time: '08:15', avatar: 'https://ui-avatars.com/api/?name=JH&background=3d2b1f&color=fff' },
          { id: 2, sender: 'Grace Mwamba', text: 'Mambo, Juma! I am planning a joint order from AgriSeeds shop to save on transit.', time: '08:22', avatar: 'https://ui-avatars.com/api/?name=Grace+Mwamba&background=a03f29&color=fff' },
          { id: 3, sender: 'Dr. Richard Mgata', text: 'Ensure you buy certified base inputs. Base dressing is critical during long rains.', time: '08:45', avatar: 'https://ui-avatars.com/api/?name=Dr+Mgata&background=3d2b1f&color=fff' }
        ]
      },
      {
        id: 'expert_mgata',
        name: 'Dr. Richard Mgata (Agronomist)',
        subtitle: 'TARI Research Specialist',
        type: 'expert',
        avatar: 'https://ui-avatars.com/api/?name=Dr+Mgata&background=3d2b1f&color=fff',
        seededMessages: [
          { id: 1, sender: 'Dr. Richard Mgata', text: 'Habari, Neema! The soil analysis report for your north plot is complete.', time: 'Yesterday', avatar: 'https://ui-avatars.com/api/?name=Dr+Mgata&background=3d2b1f&color=fff' },
          { id: 2, sender: 'Neema Mwangi', text: 'Asante sana, Dr. What is the pH reading?', time: 'Yesterday', avatar: 'https://images.unsplash.com/photo-1594744803329-e58b31de8bf5?w=100&h=100&fit=crop&crop=face' },
          { id: 3, sender: 'Dr. Richard Mgata', text: 'It reads 6.2 pH. This is optimal for Maize (TAN 250 variety). Continue with organic mulch.', time: 'Yesterday', avatar: 'https://ui-avatars.com/api/?name=Dr+Mgata&background=3d2b1f&color=fff' }
        ]
      },
      {
        id: 'transporter_banda',
        name: 'Samuel Banda (Usafiri)',
        subtitle: 'Logistics Fleet Driver',
        type: 'transporter',
        avatar: 'https://ui-avatars.com/api/?name=Samuel+Banda&background=354b48&color=fff',
        seededMessages: [
          { id: 1, sender: 'Samuel Banda', text: 'Habari! I am currently scheduled for a trip from Morogoro, but I can pick up your beans from Iringa on Friday.', time: 'Monday', avatar: 'https://ui-avatars.com/api/?name=Samuel+Banda&background=354b48&color=fff' }
        ]
      },
      {
        id: 'shop_iringa',
        name: 'AgriSeeds Iringa (Shop)',
        subtitle: 'Input Merchant Depot',
        type: 'shop',
        icon: 'storefront',
        color: 'bg-tertiary-fixed-dim/20 text-tertiary-container',
        seededMessages: [
          { id: 1, sender: 'AgriSeeds Iringa', text: 'Habari! We have received a new supply of certified Katumani seeds and DAP bags.', time: 'May 12', avatar: 'https://ui-avatars.com/api/?name=AgriSeeds&background=1e3330&color=fff' }
        ]
      }
    ];

    function initChat() {
      // Ensure chat messages DB structure exists
      if (!DB.chatMessages) {
        DB.chatMessages = {};
      }
      
      // Seed default messages if missing
      threads.forEach(t => {
        if (!DB.chatMessages[t.id]) {
          DB.chatMessages[t.id] = t.seededMessages;
        }
      });
      DB.save();

      renderThreadsSidebar();
      loadThread(currentThreadId);

      // Event Listeners
      const sendBtn = document.getElementById('chat-send-btn');
      const inputText = document.getElementById('chat-input-text');

      sendBtn.addEventListener('click', () => sendMessage());
      inputText.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });

      // Search filters
      const searchInput = document.getElementById('chat-search');
      searchInput.addEventListener('input', (e) => {
        filterThreads(e.target.value);
      });
    }

    function renderThreadsSidebar() {
      const listContainer = document.getElementById('chat-sidebar-list');
      if (!listContainer) return;

      listContainer.innerHTML = '';
      threads.forEach(t => {
        const msgs = DB.chatMessages[t.id] || [];
        const lastMsg = msgs[msgs.length - 1] || { text: 'No messages yet', time: '' };
        
        const isCurrent = t.id === currentThreadId;
        const activeClass = isCurrent ? 'bg-primary-container/10 border-l-4 border-primary font-bold' : 'hover:bg-surface-container';

        let avatarHtml = '';
        if (t.avatar) {
          avatarHtml = `<img src="${t.avatar}" class="w-11 h-11 rounded-full object-cover shrink-0">`;
        } else {
          avatarHtml = `
            <div class="w-11 h-11 rounded-full ${t.color || 'bg-primary/5 text-primary'} flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined">${t.icon || 'chat'}</span>
            </div>
          `;
        }

        const threadEl = document.createElement('div');
        threadEl.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all ${activeClass}`;
        threadEl.innerHTML = `
          ${avatarHtml}
          <div class="flex-grow min-w-0">
            <div class="flex justify-between items-center mb-0.5">
              <h4 class="font-label-md text-label-md truncate text-primary">${t.name}</h4>
              <span class="text-[9px] text-outline">${lastMsg.time}</span>
            </div>
            <p class="text-body-sm font-body-sm text-on-surface-variant truncate">${lastMsg.text}</p>
          </div>
        `;

        threadEl.addEventListener('click', () => {
          currentThreadId = t.id;
          renderThreadsSidebar();
          loadThread(t.id);
        });

        listContainer.appendChild(threadEl);
      });
    }

    function loadThread(threadId) {
      const activeThread = threads.find(t => t.id === threadId);
      if (!activeThread) return;

      // Update Header
      const headerTitle = document.getElementById('chat-header-title');
      const headerSubtitle = document.getElementById('chat-header-subtitle');
      const headerAvatar = document.getElementById('chat-header-avatar');

      headerTitle.textContent = activeThread.name;
      headerSubtitle.textContent = activeThread.subtitle;
      
      if (activeThread.avatar) {
        headerAvatar.innerHTML = `<img src="${activeThread.avatar}" class="w-full h-full object-cover">`;
      } else {
        headerAvatar.innerHTML = `<span class="material-symbols-outlined text-primary">${activeThread.icon || 'chat'}</span>`;
      }

      // Render Messages
      const canvas = document.getElementById('chat-canvas');
      canvas.innerHTML = '';

      const msgs = DB.chatMessages[threadId] || [];
      
      if (msgs.length === 0) {
        canvas.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-center p-8">
            <span class="material-symbols-outlined text-5xl text-outline mb-2">forum</span>
            <p class="text-body-md text-on-surface-variant">Send a message to start this Tanzanian agricultural exchange!</p>
          </div>
        `;
        return;
      }

      let lastSender = '';
      msgs.forEach(m => {
        const isUser = m.sender === 'Neema Mwangi' || m.sender === 'You';
        
        const bubbleEl = document.createElement('div');
        if (isUser) {
          bubbleEl.className = 'flex flex-col items-end gap-1 max-w-[85%] ml-auto';
          bubbleEl.innerHTML = `
            <div class="flex items-center gap-1.5 px-2">
              <span class="text-[9px] text-outline">${m.time}</span>
              <span class="font-label-md text-label-md font-bold text-secondary-container">You</span>
            </div>
            <div class="bg-primary text-white p-3 rounded-2xl rounded-tr-none shadow-md">
              <p class="font-body-md text-body-md whitespace-pre-wrap">${m.text}</p>
            </div>
          `;
        } else {
          bubbleEl.className = 'flex items-end gap-3.5 max-w-[85%]';
          
          let senderAvatar = m.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.sender)}&background=3d2b1f&color=fff`;
          
          bubbleEl.innerHTML = `
            <img src="${senderAvatar}" class="w-8 h-8 rounded-full object-cover shrink-0 shadow-sm">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-label-md text-label-md font-bold text-primary">${m.sender}</span>
                <span class="text-[9px] text-outline">${m.time}</span>
              </div>
              <div class="glass-panel p-3 rounded-2xl rounded-tl-none shadow-sm border border-outline-variant/10 bg-surface-container-low/40">
                <p class="font-body-md text-body-md text-on-surface whitespace-pre-wrap">${m.text}</p>
              </div>
            </div>
          `;
        }
        
        canvas.appendChild(bubbleEl);
      });

      // Scroll to bottom
      setTimeout(() => {
        canvas.scrollTop = canvas.scrollHeight;
      }, 50);
    }

    function sendMessage() {
      const input = document.getElementById('chat-input-text');
      const text = input.value.trim();
      if (!text) return;

      const date = new Date();
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Save user message
      const userMsg = {
        id: Date.now(),
        sender: 'Neema Mwangi',
        text: text,
        time: timeStr,
        avatar: 'https://images.unsplash.com/photo-1594744803329-e58b31de8bf5?w=100&h=100&fit=crop&crop=face'
      };

      if (!DB.chatMessages[currentThreadId]) {
        DB.chatMessages[currentThreadId] = [];
      }
      
      DB.chatMessages[currentThreadId].push(userMsg);
      DB.save();
      
      input.value = '';
      loadThread(currentThreadId);
      renderThreadsSidebar();

      // Trigger automatic simulated response
      triggerAutoReply(text);
    }

    function triggerAutoReply(userQuery) {
      const indicator = document.getElementById('chat-typing-indicator');
      const text = document.getElementById('chat-typing-text');
      const thread = threads.find(t => t.id === currentThreadId);
      if (!thread) return;

      // Show typing indicator
      setTimeout(() => {
        if (indicator && text) {
          text.textContent = `${thread.name} is typing...`;
          indicator.classList.remove('hidden');
          const canvas = document.getElementById('chat-canvas');
          canvas.scrollTop = canvas.scrollHeight;
        }
      }, 400);

      // Add response
      setTimeout(() => {
        if (indicator) {
          indicator.classList.add('hidden');
        }

        let replyText = '';
        let replySender = thread.name.split(' (')[0];
        let avatar = thread.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(replySender)}&background=3d2b1f&color=fff`;

        const query = userQuery.toLowerCase();

        if (thread.id === 'expert_mgata') {
          if (query.includes('maize') || query.includes('mahindi') || query.includes('yellow') || query.includes('leaf') || query.includes('ugonjwa')) {
            replyText = "Habari Neema! Yellowing leaves on maize is usually a sign of Nitrogen deficiency. I recommend applying Urea side dressing (50kg/ha) as soon as possible. Also, if you suspect any pest or fungal disease, please take a photo and upload it to the 'Jicho AI crop scanner' for instant diagnosis and direct treatment links!";
          } else if (query.includes('bei') || query.includes('soko') || query.includes('soko la mahindi')) {
            replyText = "Habari. The marketplace prices are trending up, with maize going at TZS 850/kg in Iringa and rice at TZS 1,500/kg. Selling directly to verified processors through Agri-Nest guarantees swift escrow payouts!";
          } else {
            replyText = "Habari Neema! That is an interesting query. For optimal yield this season, keep checking your crop health logs and keep your digital spray diary updated. Let me know if you would like me to schedule a video soil review.";
          }
        } else if (thread.id === 'transporter_banda') {
          if (query.includes('safari') || query.includes('kabila') || query.includes('bei') || query.includes('transport')) {
            replyText = "Mambo! For Iringa to Dar es Salaam, standard rate is TZS 350,000 for standard 5-ton lorries. My truck (T123 ABC) is available. You can book my fleet through the Usafiri transport dashboard and I will confirm instantly!";
          } else {
            replyText = "Safi sana Neema! Confirmed. Let me know once the cargo load details are ready. My Isuzu NPR truck is fully operational and has a 3-ton capacity. Ready for dispatch!";
          }
        } else if (thread.id === 'shop_iringa') {
          replyText = "Habari! Our input merchant depot is fully stocked. Certified maize seed is TZS 4,500/kg and DAP fertilizer bags are TZS 85,000. Pay through AGRI-NEST's escrow wallet for a 5% cooperative discount. Karibu sana!";
        } else {
          // Group Chat
          replySender = 'Juma Hassan';
          avatar = 'https://ui-avatars.com/api/?name=JH&background=3d2b1f&color=fff';
          if (query.includes('mbegu') || query.includes('tari') || query.includes('mvua')) {
            replyText = "Kweli kabisa, kwa mvua za hapa Iringa msimu huu, mbegu ya Katumani Composite imetoa matokeo bora zaidi kuliko zile za asili. Inastahimili ukame!";
          } else {
            replyText = "Hiyo ni habari nzuri sana! Mimi pia nitajiunga na agizo lenu la mbolea ili kupunguza gharama za usafiri wa pamoja.";
          }
        }

        const date = new Date();
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const replyMsg = {
          id: Date.now(),
          sender: replySender,
          text: replyText,
          time: timeStr,
          avatar: avatar
        };

        DB.chatMessages[currentThreadId].push(replyMsg);
        DB.save();

        loadThread(currentThreadId);
        renderThreadsSidebar();
        
        // Show success alert toast
        Shell.toast(`New message from ${replySender}`, 'info');

      }, 1800);
    }

    function filterThreads(query) {
      const q = query.toLowerCase();
      const listContainer = document.getElementById('chat-sidebar-list');
      const items = listContainer.children;
      
      threads.forEach((t, i) => {
        const item = items[i];
        if (!item) return;
        const matches = t.name.toLowerCase().includes(q) || t.subtitle.toLowerCase().includes(q);
        item.style.display = matches ? 'flex' : 'none';
      });
    }

    // Run Initialization
    setTimeout(initChat, 100);
  })();
</script>
