  <script>
    // Initialize App
    (function () {
      if (location.protocol === 'file:') {
        const b = document.getElementById('security-banner');
        if (b) b.classList.remove('hidden');
        return;
      }

      // Dev: clear service worker so it does not cache broken/stale assets
      if (window.__AGRI_NEST_DEV__ && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      } else if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[SW] Registered:', reg.scope))
          .catch((err) => console.warn('[SW] Registration failed:', err));
      }

      // Seed initial state from DB
      const savedUser = JSON.parse(localStorage.getItem('agri-nest-user') || 'null');
      if (savedUser) AppState.set('user', savedUser);

      try {
        ThemeController.init();
        AppState.initLanguage();
        if (typeof AppCore !== 'undefined') AppCore.init();
        Shell.init();
        Router.init();
        if (typeof AIWidget !== 'undefined') AIWidget.init();
      } catch (err) {
        console.error('[AGRI-NEST] Startup failed:', err);
        const b = document.getElementById('security-banner');
        if (b) {
          b.classList.remove('hidden');
          b.innerHTML = '<strong>App failed to start.</strong> ' + (err.message || err) +
            ' — refresh the page or run <code>npm run web:serve</code>.';
        }
      }

      // PWA install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        Shell.toast('Install AGRI-NEST for offline access', 'info');
      });

      // Handle online/offline
      window.addEventListener('online', () => Shell.toast('Back online!', 'success'));
      window.addEventListener('offline', () => Shell.toast('You are offline. Some features may be limited.', 'info'));
    })();
  </script>
</body>
</html>
